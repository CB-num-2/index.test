<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            padding:0px;
        }
        .color-block {
            width: 200px;
            height: 200px;
            background-color: lightgray;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="myBlock" class="color-block"></div>
    <h4 class="color-block">This block won't change</h4>
    <button onclick="cBC()">Change Color</button>

    <script>
const colors = ["red", "orange", "yellow", "green", "blue", "purple"];
let currentStep = 0;

function cBC() {
    const block = document.getElementById("myBlock");
    currentStep = (currentStep + 1) % colors.length; 
    block.style.backgroundColor = colors[currentStep];
    setTimeout(() => {
        cBC()
                     }, 300)
}
    cBC();
    </script>

</body>
</html>
